[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathway-subtyping"
version = "0.6.2"
description = "A disease-agnostic framework for identifying molecular subtypes through pathway-based analysis of rare genetic variants"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Rohit Chauhan", email = "info@topmist.com"}
]
maintainers = [
    {name = "Rohit Chauhan", email = "info@topmist.com"}
]
keywords = [
    "genomics",
    "pathway-analysis",
    "molecular-subtypes",
    "clustering",
    "rare-variants",
    "bioinformatics",
    "autism",
    "neurogenetics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "click>=8.0.0,<9.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "nbformat>=5.0.0",
]
vcf = [
    "pysam>=0.21.0,<1.0.0",
]
viz = [
    "plotly>=5.15.0,<6.0.0",
    "umap-learn>=0.5.0,<1.0.0",
    "kaleido>=0.2.0,<1.0.0",
]
sc = [
    "anndata>=0.9.0,<1.0.0",
]
graph = [
    "networkx>=3.0,<4.0",
    "py4cytoscape>=1.0.0",
]
qc = [
    "pathway-subtyping[graph]",
]
autism = [
    # Pure Python — no heavy dependencies. Rules engine + therapeutic scoring.
]
gnn = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
]
# v0.6 foundation-model extras. Each extra installs the PyTorch substrate
# required by the corresponding Official*Backend; the model-specific upstream
# package (geneformer, scgpt, nicheformer, borzoi, evo2, uce) and its
# checkpoint must be installed separately because not all of them ship stable
# PyPI wheels yet. The deterministic fallback embedders / scorers work
# without any of these extras — see docs/guides/*.md for the fallback pattern.
harmonize = [
    "torch>=2.0.0",
]
perturb = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
]
embed = [
    "torch>=2.0.0",
]
genesets = [
    "torch>=2.0.0",
]
qc-sequence = [
    "torch>=2.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
]
all = [
    "pathway-subtyping[dev,notebooks,docs,vcf,viz,sc,graph,qc,autism,gnn,harmonize,perturb,embed,genesets,qc-sequence]",
]

[project.scripts]
pathway-subtyping = "pathway_subtyping.cli:main"
psf = "pathway_subtyping.cli:main"

[project.urls]
Homepage = "https://codeberg.org/pathways/pathway-subtyping-framework"
Documentation = "https://codeberg.org/pathways/pathway-subtyping-framework#readme"
Repository = "https://codeberg.org/pathways/pathway-subtyping-framework.git"
Issues = "https://codeberg.org/pathways/pathway-subtyping-framework/issues"
Changelog = "https://codeberg.org/pathways/pathway-subtyping-framework/releases"
RRID = "https://scicrunch.org/resolver/RRID:SCR_028051"
Docker = "https://hub.docker.com/r/rohitdataops/pathway-subtyping"
"bio.tools" = "https://bio.tools/pathway-subtyping"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pathway_subtyping = ["py.typed", "data/pathways/*.gmt", "qc/testing/fixtures/*.yaml"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["pathway_subtyping"]

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "network: marks tests requiring network access (deselect with '-m \"not network\"')",
]
filterwarnings = [
    # sklearn GMM matmul warnings are benign (numerical edge cases in simulation)
    "ignore:.*matmul.*:RuntimeWarning",
    # deconvolution matmul edge cases
    "ignore:.*matmul.*:RuntimeWarning:pathway_subtyping.deconvolution",
    # scipy constant input in statistical tests
    "ignore:.*constant.*:scipy.stats.ConstantInputWarning",
    # unclosed file handles in pipeline tests (logging handlers)
    "ignore::ResourceWarning",
    # umap n_jobs override + tensorflow ImportWarning
    "ignore:n_jobs value.*:UserWarning",
    "ignore:Tensorflow not installed.*:ImportWarning",
    # kaleido setDaemon deprecation
    "ignore:setDaemon.*:DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/pathway_subtyping"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

# MyPy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
